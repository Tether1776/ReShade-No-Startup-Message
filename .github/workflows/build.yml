name: build

on:
  workflow_dispatch:
  push:
    branches:
      - custom-6.7.3
      - custom-6.8.0
      - main

permissions: {}

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build ReShade (64-bit & 32-bit)
        run: |
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=64-bit /p:RESHADE_ADDON=2 /p:PlatformToolset=v143
          msbuild ReShade.sln /p:Configuration=Release /p:Platform=32-bit /p:RESHADE_ADDON=2 /p:PlatformToolset=v143

      - name: Prepare Output Package
        run: |
          mkdir .\release_package
          
          copy ReShade.ini .\release_package\ReShade.ini
          
          # Copy 64-bit native DLL, Vulkan JSON, and API wrappers
          copy .\bin\x64\Release\ReShade64.dll .\release_package\ReShade64.dll
          copy .\res\ReShade64.json .\release_package\ReShade64.json
          copy .\bin\x64\Release\ReShade64.dll .\release_package\dxgi.dll
          copy .\bin\x64\Release\ReShade64.dll .\release_package\d3d11.dll
          copy .\bin\x64\Release\ReShade64.dll .\release_package\d3d12.dll
          copy .\bin\x64\Release\ReShade64.dll .\release_package\d3d9.dll
          copy .\bin\x64\Release\ReShade64.dll .\release_package\opengl32.dll

          # Copy 32-bit native DLL and Vulkan JSON
          copy .\bin\Win32\Release\ReShade32.dll .\release_package\ReShade32.dll
          copy .\res\ReShade32.json .\release_package\ReShade32.json

      - name: Upload Clean ReShade Package
        uses: actions/upload-artifact@v7
        with:
          name: ReShade-Complete-Package
          path: './release_package/*'
